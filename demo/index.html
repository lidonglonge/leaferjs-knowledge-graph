<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeaferJS Knowledge Graph Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }
    #container {
      width: 100vw;
      height: 100vh;
      background: #fff;
    }
    .controls {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      background: #1890ff;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    button:hover { background: #40a9ff; }
    .info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 16px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button id="btn-force">力导向布局</button>
    <button id="btn-circular">环形布局</button>
    <button id="btn-grid">网格布局</button>
  </div>
  
  <div id="container"></div>
  
  <div class="info">
    LeaferJS Knowledge Graph Demo - 点击按钮切换布局
  </div>

  <script type="module">
    import { Graph } from '../dist/index.es.js'
    import 'leafer-ui'

    // 示例数据
    const data = {
      nodes: [
        { id: '1', label: '中心节点', style: { fill: '#ff6b6b' } },
        { id: '2', label: '节点 A' },
        { id: '3', label: '节点 B' },
        { id: '4', label: '节点 C' },
        { id: '5', label: '节点 D' },
        { id: '6', label: '节点 E' },
        { id: '7', label: '节点 F' },
        { id: '8', label: '节点 G' },
      ],
      edges: [
        { source: '1', target: '2' },
        { source: '1', target: '3' },
        { source: '1', target: '4' },
        { source: '2', target: '5' },
        { source: '2', target: '6' },
        { source: '3', target: '7' },
        { source: '4', target: '8' },
      ]
    }

    // 创建图实例
    const graph = new Graph({
      container: document.getElementById('container'),
      width: window.innerWidth,
      height: window.innerHeight,
    })

    // 设置数据并渲染
    graph.setData(data)

    // 默认使用力导向布局
    setTimeout(() => graph.layout('force'), 100)

    // 绑定按钮事件
    document.getElementById('btn-force').onclick = () => graph.layout('force')
    document.getElementById('btn-circular').onclick = () => graph.layout('circular')
    document.getElementById('btn-grid').onclick = () => graph.layout('grid')

    // 窗口大小调整
    window.addEventListener('resize', () => {
      // 重新适应视图
      graph.fitView()
    })

    console.log('✅ LeaferJS Knowledge Graph Demo loaded')
    console.log('Graph instance:', graph)
  </script>
</body>
</html>
